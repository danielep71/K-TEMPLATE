name: OpenSSF Scorecard

# Supply-chain posture of the default branch: branch protection, token
# permissions, pinned dependencies, dangerous workflow patterns, signed
# releases and the other OpenSSF Scorecard checks. Results go to the public
# Scorecard service and to Security -> Code scanning, beside CodeQL's.
#
# The Scorecard service accepts published results only from the default
# branch, and only from a job that uses approved actions and no run steps:
# keep the job's steps to the four below. Scorecard reads the repository's
# settings through the API, so it is skipped on a private repository, where
# its publication is not available. It is not required by the rulesets, so it
# never blocks a merge.

on:
  branch_protection_rule:
  # No branch filter, so a renamed default branch needs no edit here; the job
  # condition skips every other branch.
  push:
  schedule:
    # Weekly, off the hour; GitHub may start scheduled runs late.
    - cron: "41 5 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    if: >-
      github.event.repository.private == false &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Publishes the results to the Scorecard service.
      id-token: write
      # Uploads the SARIF to code scanning.
      security-events: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Keep the Scorecard SARIF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-${{ github.run_id }}-${{ github.run_attempt }}
          path: results.sarif
          if-no-files-found: error
          retention-days: 30
      - name: Publish to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
