name: OpenSSF Scorecard

# Supply-chain posture of the default branch: branch protection, token
# permissions, pinned dependencies, dangerous workflow patterns, signed
# releases and the other OpenSSF Scorecard checks. Results go to the public
# Scorecard service and to Security -> Code scanning, beside CodeQL's.
#
# The Scorecard service accepts published results only from the default
# branch, and only from a job that uses approved actions and no run steps:
# keep the analysis job's steps to the four below; the visibility check is a
# separate job for that reason. Scorecard reads the repository's settings
# through the API, so it is skipped on a private repository, where its
# publication is not available. It is not required by the rulesets, so it
# never blocks a merge.

on:
  branch_protection_rule:
  # No branch filter, so a renamed default branch needs no edit here; the job
  # condition skips every other branch.
  push:
  schedule:
    # Weekly, off the hour; GitHub may start scheduled runs late.
    - cron: "41 5 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visibility:
    name: Repository visibility
    # Scheduled events do not carry the repository in their payload, so the
    # weekly run is exempt from the branch test (it always runs on the default
    # branch) and the visibility is read from the API.
    if: >-
      github.event_name == 'schedule' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      public: ${{ steps.check.outputs.public }}
    steps:
      - name: Read the repository visibility
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)"
          if [[ "$visibility" == "public" ]]; then
            echo "public=true" >> "$GITHUB_OUTPUT"
          else
            echo "public=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Scorecard skipped: the repository is ${visibility}."
          fi

  analysis:
    name: Scorecard analysis
    needs: visibility
    if: needs.visibility.outputs.public == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Publishes the results to the Scorecard service.
      id-token: write
      # Uploads the SARIF to code scanning.
      security-events: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Keep the Scorecard SARIF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-${{ github.run_id }}-${{ github.run_attempt }}
          path: results.sarif
          if-no-files-found: error
          retention-days: 30
      - name: Publish to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
