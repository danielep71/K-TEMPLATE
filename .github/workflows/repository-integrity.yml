name: Repository integrity

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new commit on a pull request cancels the run of the commit it replaces.
  # Every other run has a group of its own, so a push is never cancelled, nor
  # queued behind another run.
  group: repository-integrity-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The quality-gate tests fail instead of skipping when a tool is missing.
      REQUIRE_QUALITY_TOOLS: "1"
      # actionlint release and the SHA-256 of its Linux x86_64 archive.
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_LINUX_AMD64_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.18"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          package-manager-cache: false
      - name: Install pinned configuration parser
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            -r .github/requirements.txt
      - name: Install hash-locked Python quality tools
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            -r tools/requirements-quality-ci.txt
      - name: Install checksum-verified actionlint
        run: |
          validator_dir="${RUNNER_TEMP}/actionlint-${ACTIONLINT_VERSION}"
          archive="${validator_dir}/actionlint.tar.gz"
          mkdir -p "$validator_dir"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --retry 3 \
            --retry-all-errors \
            --show-error \
            --silent \
            --tlsv1.2 \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_LINUX_AMD64_SHA256" "$archive" \
            | sha256sum --check --strict
          tar --no-same-owner -xzf "$archive" -C "$validator_dir" actionlint
          echo "$validator_dir" >> "$GITHUB_PATH"
      - name: Run the repository checks
        # One command runs every check, as locally; it writes per-check logs,
        # report.json and the job summary under test-results/integrity/.
        env:
          IS_TEMPLATE: ${{ github.event.repository.is_template }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python tools/check_repository.py --strict --ci \
            --repository "$GITHUB_REPOSITORY" \
            --default-branch "$DEFAULT_BRANCH" \
            --template "$IS_TEMPLATE" \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Keep the integrity reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integrity-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/integrity/
          if-no-files-found: error
          retention-days: 30

  minimum-python:
    # Not a required check: it confirms the documented Python floor.
    name: Minimum Python (3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.18"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          package-manager-cache: false
      - name: Install pinned configuration parser
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            -r .github/requirements.txt
      - name: Run repository tests
        run: python -m unittest discover -s tests
