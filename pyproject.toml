# Quality settings for the repository's Python tooling. The tools and tests
# need only the Python standard library, plus PyYAML for the tests that read
# YAML and the codeql-default-branch check; they also run Node.js for the
# label scripts and git to list files.
# The setup script and the release check also run the GitHub CLI, and the
# external link check curl. The optional hosts of tools/devbuild/ are Excel
# through PowerShell on Windows (excel_run.py) and LibreOffice (lo_smoke.py).
# Ruff and mypy are CI and development tools, installed from
# tools/requirements-quality-ci.txt.

[tool.ruff]
target-version = "py311"
# Formatting target only: E501 is not selected and CI does not run ruff format.
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I001", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
python_version = "3.11"
files = ["tools", "tests"]
mypy_path = ["tools", "tools/devbuild"]
pretty = true
show_error_codes = true
warn_unused_configs = true
strict = true
# Not part of strict: report code that type narrowing proves can never run.
warn_unreachable = true

[[tool.mypy.overrides]]
# PyYAML ships no type information; its stubs are not installed.
module = ["yaml", "yaml.*"]
ignore_missing_imports = true
